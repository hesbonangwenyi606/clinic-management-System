services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: cms
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a strong URL-safe POSTGRES_PASSWORD in .env}
      POSTGRES_DB: clinic_management
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - cms_database:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U cms -d clinic_management']
      interval: 5s
      timeout: 5s
      retries: 10
  migrate:
    build:
      context: .
      target: api
    env_file: .env
    environment:
      DATABASE_URL: postgresql://cms:${POSTGRES_PASSWORD}@db:5432/clinic_management?schema=public
    command: ['node', 'apps/api/scripts/initialize.cjs']
    depends_on:
      db:
        condition: service_healthy
  api:
    build:
      context: .
      target: api
    env_file: .env
    environment:
      DATABASE_URL: postgresql://cms:${POSTGRES_PASSWORD}@db:5432/clinic_management?schema=public
      CMS_API_PORT: '3001'
    ports:
      - '127.0.0.1:3001:3001'
    depends_on:
      migrate:
        condition: service_completed_successfully
  web:
    build:
      context: .
      target: web
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
    ports:
      - '127.0.0.1:3000:3000'
    depends_on:
      - api
volumes:
  cms_database:
