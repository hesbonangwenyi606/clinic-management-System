name: Validate CMS
on: [push, pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cms
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: cms_test
        ports: ['5432:5432']
        options: >-
          --health-cmd 'pg_isready -U cms -d cms_test'
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://cms:ci-password@localhost:5432/cms_test?schema=public
      CMS_TEST_DATABASE: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:generate --workspace @cms/api
      - run: npm run db:deploy --workspace @cms/api
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:integration --workspace @cms/api
